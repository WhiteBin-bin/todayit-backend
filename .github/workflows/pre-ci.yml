name: 저장소 기본 검사

on:
  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  gradle-check:
    name: Backend 전체 검사
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 Checkout
        uses: actions/checkout@v6

      - name: Java 21 설정
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Gradle 설정
        uses: gradle/actions/setup-gradle@v6

      - name: Gradle Wrapper 실행 권한 설정
        run: chmod +x gradlew

      - name: 전체 검사
        run: ./gradlew check --no-daemon

  actionlint:
    name: GitHub Actions 문법 검사
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 Checkout
        uses: actions/checkout@v6

      - name: actionlint 실행
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color

  gitleaks:
    name: Secret 유출 검사
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Gitleaks 실행
        shell: bash
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            -w /repo \
            -e GIT_CONFIG_COUNT=1 \
            -e GIT_CONFIG_KEY_0=safe.directory \
            -e GIT_CONFIG_VALUE_0=/repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git --redact --verbose .
