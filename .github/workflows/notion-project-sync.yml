name: GitHub Project → Notion 동기화

on:
  schedule:
    - cron: "*/5 * * * *"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-project-notion-sync
  cancel-in-progress: false

jobs:
  sync:
    name: 개발 작업 현황 동기화
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: GitHub App 토큰 발급
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: today-it
          repositories: backend
          permission-issues: read
          permission-metadata: read
          permission-organization-projects: read

      - name: GitHub Project → Notion 동기화
        uses: actions/github-script@v8
        env:
          GITHUB_ORG: today-it
          PROJECT_NUMBER: ${{ vars.PROJECT_NUMBER }}
          NOTION_API_TOKEN: ${{ secrets.NOTION_API_TOKEN }}
          NOTION_DATA_SOURCE_ID: ${{ vars.NOTION_DATA_SOURCE_ID }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const NOTION_VERSION = "2026-03-11";

            const organization = process.env.GITHUB_ORG;
            const projectNumber = Number(process.env.PROJECT_NUMBER);
            const notionToken = process.env.NOTION_API_TOKEN;
            const notionDataSourceId = process.env.NOTION_DATA_SOURCE_ID;

            if (!organization) {
              throw new Error("GITHUB_ORG가 설정되지 않았습니다.");
            }

            if (!Number.isInteger(projectNumber) || projectNumber <= 0) {
              throw new Error("PROJECT_NUMBER가 올바르게 설정되지 않았습니다.");
            }

            if (!notionToken) {
              throw new Error("NOTION_API_TOKEN이 설정되지 않았습니다.");
            }

            if (!notionDataSourceId) {
              throw new Error("NOTION_DATA_SOURCE_ID가 설정되지 않았습니다.");
            }

            const sleep = (ms) =>
              new Promise((resolve) => setTimeout(resolve, ms));

            async function notionRequest(path, options = {}) {
              const maxRetries = 3;

              for (let attempt = 0; attempt <= maxRetries; attempt++) {
                const response = await fetch(
                  `https://api.notion.com/v1${path}`,
                  {
                    ...options,
                    headers: {
                      Authorization: `Bearer ${notionToken}`,
                      "Notion-Version": NOTION_VERSION,
                      "Content-Type": "application/json",
                      ...(options.headers || {}),
                    },
                  }
                );

                if (
                  (response.status === 429 || response.status >= 500) &&
                  attempt < maxRetries
                ) {
                  const retryAfter =
                    Number(response.headers.get("retry-after")) ||
                    Math.pow(2, attempt);

                  console.log(
                    `Notion API ${response.status} 응답. ${retryAfter}초 후 재시도합니다.`
                  );

                  await sleep(retryAfter * 1000);
                  continue;
                }

                const text = await response.text();

                let body = null;

                if (text) {
                  try {
                    body = JSON.parse(text);
                  } catch {
                    body = text;
                  }
                }

                if (!response.ok) {
                  throw new Error(
                    `Notion API 요청 실패: ${response.status} ${JSON.stringify(body)}`
                  );
                }

                return body;
              }

              throw new Error("Notion API 요청 재시도 횟수를 초과했습니다.");
            }

            function normalizeSelectName(name) {
              return String(name)
                .replaceAll(",", "，")
                .slice(0, 100);
            }

            function githubColorToNotionColor(color) {
              const supported = new Set([
                "blue",
                "gray",
                "green",
                "orange",
                "pink",
                "purple",
                "red",
                "yellow",
              ]);

              const normalized = String(color || "").toLowerCase();

              return supported.has(normalized)
                ? normalized
                : "default";
            }

            async function getProjectData() {
              const query = `
                query(
                  $organization: String!
                  $projectNumber: Int!
                  $cursor: String
                ) {
                  organization(login: $organization) {
                    projectV2(number: $projectNumber) {
                      title

                      fields(first: 100) {
                        nodes {
                          ... on ProjectV2SingleSelectField {
                            name
                            options {
                              id
                              name
                              color
                            }
                          }
                        }
                      }

                      items(
                        first: 100
                        after: $cursor
                      ) {
                        nodes {
                          id
                          isArchived

                          fieldValueByName(name: "Status") {
                            ... on ProjectV2ItemFieldSingleSelectValue {
                              name
                            }
                          }

                          content {
                            __typename

                            ... on Issue {
                              number
                              title
                              url

                              labels(first: 50) {
                                nodes {
                                  name
                                }
                              }

                              assignees(first: 20) {
                                nodes {
                                  login
                                }
                              }
                            }
                          }
                        }

                        pageInfo {
                          hasNextPage
                          endCursor
                        }
                      }
                    }
                  }
                }
              `;

              const items = [];
              let cursor = null;
              let projectTitle = null;
              let statusOptions = null;

              do {
                const response = await github.graphql(query, {
                  organization,
                  projectNumber,
                  cursor,
                });

                const project = response.organization?.projectV2;

                if (!project) {
                  throw new Error(
                    `${organization} Organization에서 Project #${projectNumber}를 찾을 수 없습니다.`
                  );
                }

                projectTitle = project.title;

                if (!statusOptions) {
                  const statusField = project.fields.nodes.find(
                    (field) =>
                      field?.name === "Status" &&
                      Array.isArray(field.options)
                  );

                  if (!statusField) {
                    throw new Error(
                      'GitHub Project에서 "Status" 필드를 찾을 수 없습니다.'
                    );
                  }

                  statusOptions = statusField.options.map((option) => ({
                    name: option.name,
                    color: option.color,
                  }));
                }

                items.push(...project.items.nodes);

                if (!project.items.pageInfo.hasNextPage) {
                  cursor = null;
                  break;
                }

                cursor = project.items.pageInfo.endCursor;
              } while (cursor);

              console.log(
                `GitHub Project "${projectTitle}"에서 ${items.length}개의 Item을 조회했습니다.`
              );

              console.log(
                `Project Status: ${statusOptions
                  .map((option) => option.name)
                  .join(" / ")}`
              );

              return {
                projectTitle,
                statusOptions,
                items,
              };
            }

            async function ensureNotionSelectOptions(projectStatusOptions) {
              const dataSource = await notionRequest(
                `/data_sources/${notionDataSourceId}`,
                {
                  method: "GET",
                }
              );

              const property = dataSource.properties?.["상태"];

              if (!property) {
                throw new Error('Notion에 "상태" 속성이 없습니다.');
              }

              if (property.type !== "select") {
                throw new Error(
                  `Notion "상태" 속성은 "선택(Select)" 타입이어야 합니다. 현재 타입: ${property.type}`
                );
              }

              const existingOptions =
                property.select?.options || [];

              const existingNames = new Set(
                existingOptions.map((option) => option.name)
              );

              const missingOptions = projectStatusOptions
                .map((option) => ({
                  name: normalizeSelectName(option.name),
                  color: githubColorToNotionColor(option.color),
                }))
                .filter(
                  (option) => !existingNames.has(option.name)
                );

              if (missingOptions.length === 0) {
                console.log(
                  'Notion "상태" 옵션이 이미 최신 상태입니다.'
                );
                return;
              }

              console.log(
                `Notion "상태" 옵션 추가: ${missingOptions
                  .map((option) => option.name)
                  .join(" / ")}`
              );

              await notionRequest(
                `/data_sources/${notionDataSourceId}`,
                {
                  method: "PATCH",
                  body: JSON.stringify({
                    properties: {
                      "상태": {
                        select: {
                          options: [
                            ...existingOptions.map((option) => ({
                              id: option.id,
                            })),
                            ...missingOptions,
                          ],
                        },
                      },
                    },
                  }),
                }
              );
            }

            async function getNotionPages() {
              const pages = [];
              let cursor = null;

              do {
                const body = {
                  page_size: 100,
                  filter: {
                    property: "Project Item ID",
                    rich_text: {
                      is_not_empty: true,
                    },
                  },
                };

                if (cursor) {
                  body.start_cursor = cursor;
                }

                const response = await notionRequest(
                  `/data_sources/${notionDataSourceId}/query`,
                  {
                    method: "POST",
                    body: JSON.stringify(body),
                  }
                );

                pages.push(...response.results);

                if (!response.has_more) {
                  cursor = null;
                  break;
                }

                cursor = response.next_cursor;
              } while (cursor);

              console.log(
                `Notion에서 기존 동기화 데이터 ${pages.length}개를 조회했습니다.`
              );

              return pages;
            }

            function richTextValue(property) {
              if (!property?.rich_text) {
                return "";
              }

              return property.rich_text
                .map((item) => item.plain_text || "")
                .join("");
            }

            function titleValue(property) {
              if (!property?.title) {
                return "";
              }

              return property.title
                .map((item) => item.plain_text || "")
                .join("");
            }

            function multiSelectNames(property) {
              return (property?.multi_select || [])
                .map((option) => option.name)
                .sort();
            }

            function sameStringArray(left, right) {
              if (left.length !== right.length) {
                return false;
              }

              return left.every(
                (value, index) => value === right[index]
              );
            }

            function toExpectedItem(item) {
              const issue = item.content;

              return {
                projectItemId: item.id,
                title: `#${issue.number} ${issue.title}`.slice(
                  0,
                  2000
                ),
                projectStatus:
                  item.fieldValueByName?.name || null,
                labels: (
                  issue.labels?.nodes || []
                )
                  .map((label) =>
                    normalizeSelectName(label.name)
                  )
                  .sort(),
                assignees: (
                  issue.assignees?.nodes || []
                )
                  .map((assignee) => assignee.login)
                  .sort()
                  .join(", ")
                  .slice(0, 2000),
                issueNumber: issue.number,
                githubUrl: issue.url,
              };
            }

            function hasChanges(page, expected) {
              const properties = page.properties || {};

              const currentStatus =
                properties["상태"]?.select?.name || null;

              const currentLabels =
                multiSelectNames(properties["유형"]);

              return (
                titleValue(properties["이름"]) !==
                  expected.title ||
                currentStatus !==
                  expected.projectStatus ||
                !sameStringArray(
                  currentLabels,
                  expected.labels
                ) ||
                richTextValue(properties["담당자"]) !==
                  expected.assignees ||
                properties["Issue 번호"]?.number !==
                  expected.issueNumber ||
                properties["GitHub URL"]?.url !==
                  expected.githubUrl ||
                richTextValue(
                  properties["Project Item ID"]
                ) !== expected.projectItemId
              );
            }

            function buildProperties(expected) {
              return {
                "이름": {
                  title: [
                    {
                      type: "text",
                      text: {
                        content: expected.title,
                      },
                    },
                  ],
                },

                "상태": {
                  select: expected.projectStatus
                    ? {
                        name: normalizeSelectName(
                          expected.projectStatus
                        ),
                      }
                    : null,
                },

                "유형": {
                  multi_select: expected.labels.map(
                    (name) => ({
                      name,
                    })
                  ),
                },

                "담당자": {
                  rich_text: expected.assignees
                    ? [
                        {
                          type: "text",
                          text: {
                            content: expected.assignees,
                          },
                        },
                      ]
                    : [],
                },

                "Issue 번호": {
                  number: expected.issueNumber,
                },

                "GitHub URL": {
                  url: expected.githubUrl,
                },

                "Project Item ID": {
                  rich_text: [
                    {
                      type: "text",
                      text: {
                        content: expected.projectItemId,
                      },
                    },
                  ],
                },

                "동기화 일시": {
                  date: {
                    start: new Date().toISOString(),
                  },
                },
              };
            }

            async function createNotionPage(properties) {
              return notionRequest("/pages", {
                method: "POST",
                body: JSON.stringify({
                  parent: {
                    type: "data_source_id",
                    data_source_id: notionDataSourceId,
                  },
                  properties,
                }),
              });
            }

            async function updateNotionPage(
              pageId,
              properties
            ) {
              return notionRequest(`/pages/${pageId}`, {
                method: "PATCH",
                body: JSON.stringify({
                  properties,
                }),
              });
            }

            async function trashNotionPage(pageId) {
              return notionRequest(`/pages/${pageId}`, {
                method: "PATCH",
                body: JSON.stringify({
                  in_trash: true,
                }),
              });
            }

            const projectData = await getProjectData();

            await ensureNotionSelectOptions(
              projectData.statusOptions
            );

            const issueItems = projectData.items.filter(
              (item) =>
                !item.isArchived &&
                item.content?.__typename === "Issue"
            );

            console.log(
              `동기화 대상 Issue: ${issueItems.length}개`
            );

            const notionPages = await getNotionPages();

            const notionPageMap = new Map();

            for (const page of notionPages) {
              const projectItemId = richTextValue(
                page.properties?.["Project Item ID"]
              );

              if (projectItemId) {
                notionPageMap.set(projectItemId, page);
              }
            }

            const currentProjectItemIds = new Set();

            let createdCount = 0;
            let updatedCount = 0;
            let unchangedCount = 0;
            let trashedCount = 0;

            for (const item of issueItems) {
              const expected = toExpectedItem(item);

              currentProjectItemIds.add(
                expected.projectItemId
              );

              const existingPage = notionPageMap.get(
                expected.projectItemId
              );

              if (!existingPage) {
                await createNotionPage(
                  buildProperties(expected)
                );

                createdCount++;

                console.log(
                  `CREATE: #${expected.issueNumber} ${item.content.title}`
                );

                continue;
              }

              if (!hasChanges(existingPage, expected)) {
                unchangedCount++;

                console.log(
                  `SKIP: #${expected.issueNumber} 변경 없음`
                );

                continue;
              }

              await updateNotionPage(
                existingPage.id,
                buildProperties(expected)
              );

              updatedCount++;

              console.log(
                `UPDATE: #${expected.issueNumber} ${item.content.title}`
              );
            }

            for (const [
              projectItemId,
              page,
            ] of notionPageMap) {
              if (
                currentProjectItemIds.has(projectItemId)
              ) {
                continue;
              }

              await trashNotionPage(page.id);

              trashedCount++;

              console.log(
                `TRASH: ${projectItemId}`
              );
            }

            core.summary
              .addHeading(
                "GitHub Project → Notion 동기화"
              )
              .addTable([
                [
                  {
                    data: "항목",
                    header: true,
                  },
                  {
                    data: "개수",
                    header: true,
                  },
                ],
                [
                  "GitHub Project Issue",
                  String(issueItems.length),
                ],
                [
                  "Notion 생성",
                  String(createdCount),
                ],
                [
                  "Notion 수정",
                  String(updatedCount),
                ],
                [
                  "변경 없음",
                  String(unchangedCount),
                ],
                [
                  "Notion 휴지통 이동",
                  String(trashedCount),
                ],
              ]);

            await core.summary.write();