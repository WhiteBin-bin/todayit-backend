name: Discord GitHub 알림

on:
  issues:
    types:
      - opened
      - closed
      - reopened

  issue_comment:
    types:
      - created

  pull_request_target:
    branches:
      - main
      - develop
    types:
      - opened
      - reopened
      - closed
      - ready_for_review

  push:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  notify:
    name: Discord 알림 전송
    runs-on: ubuntu-latest

    steps:
      - name: Discord 메시지 전송
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        shell: bash

        run: |
          set -euo pipefail

          EVENT="${{ github.event_name }}"
          ACTION="$(jq -r '.action // ""' "$GITHUB_EVENT_PATH")"

          EMBED_TITLE=""
          DESCRIPTION=""
          URL=""
          USER=""
          USER_URL=""
          AVATAR=""
          LABELS=""
          BRANCH_INFO=""
          COLOR="9213343"

          REPOSITORY="$(jq -r '.repository.full_name' "$GITHUB_EVENT_PATH")"
          REPOSITORY_AVATAR="$(jq -r '.repository.owner.avatar_url' "$GITHUB_EVENT_PATH")"


          truncate_text() {
            local text="$1"
            local limit="$2"

            printf '%s' "$text" |
              jq -Rs -r \
                --argjson limit "$limit" \
                '
                  if length > $limit then
                    .[0:$limit] +
                    "\n\n... (내용이 길어 일부 생략되었습니다. 제목을 눌러 GitHub에서 전체 내용을 확인해주세요.)"
                  else
                    .
                  end
                '
          }


          build_description() {
            local title="$1"
            local body="$2"

            if [ -n "$body" ]; then
              BODY_TEXT="$(truncate_text "$body" 3300)"

              DESCRIPTION="$(printf '**%s**\n\n%s' "$title" "$BODY_TEXT")"
            else
              DESCRIPTION="${title}"
            fi
          }


          case "$EVENT" in

            issues)
              NUMBER="$(jq -r '.issue.number' "$GITHUB_EVENT_PATH")"
              TITLE="$(jq -r '.issue.title' "$GITHUB_EVENT_PATH")"
              BODY="$(jq -r '.issue.body // ""' "$GITHUB_EVENT_PATH")"
              URL="$(jq -r '.issue.html_url' "$GITHUB_EVENT_PATH")"

              # 이슈 작성자
              USER="$(jq -r '.issue.user.login' "$GITHUB_EVENT_PATH")"
              USER_URL="$(jq -r '.issue.user.html_url' "$GITHUB_EVENT_PATH")"
              AVATAR="$(jq -r '.issue.user.avatar_url' "$GITHUB_EVENT_PATH")"

              LABELS="$(
                jq -r \
                  '[.issue.labels[]?.name | "`" + . + "`"] | join(" ")' \
                  "$GITHUB_EVENT_PATH"
              )"

              build_description "$TITLE" "$BODY"

              case "$ACTION" in
                opened)
                  EMBED_TITLE="📝 Issue #${NUMBER} 생성"
                  COLOR="9213343"
                  ;;

                closed)
                  EMBED_TITLE="☑️ Issue #${NUMBER} 완료"
                  COLOR="8540383"
                  ;;

                reopened)
                  EMBED_TITLE="📝 Issue #${NUMBER} 재오픈"
                  COLOR="9213343"
                  ;;
              esac
              ;;


            issue_comment)
              NUMBER="$(jq -r '.issue.number' "$GITHUB_EVENT_PATH")"
              TITLE="$(jq -r '.issue.title' "$GITHUB_EVENT_PATH")"
              COMMENT_BODY="$(jq -r '.comment.body // ""' "$GITHUB_EVENT_PATH")"
              URL="$(jq -r '.comment.html_url' "$GITHUB_EVENT_PATH")"

              # 댓글 작성자
              USER="$(jq -r '.comment.user.login' "$GITHUB_EVENT_PATH")"
              USER_URL="$(jq -r '.comment.user.html_url' "$GITHUB_EVENT_PATH")"
              AVATAR="$(jq -r '.comment.user.avatar_url' "$GITHUB_EVENT_PATH")"

              LABELS="$(
                jq -r \
                  '[.issue.labels[]?.name | "`" + . + "`"] | join(" ")' \
                  "$GITHUB_EVENT_PATH"
              )"

              IS_PR="$(jq -r '.issue.pull_request != null' "$GITHUB_EVENT_PATH")"

              if [ "$IS_PR" = "true" ]; then
                EMBED_TITLE="💬 PR #${NUMBER} 댓글"
              else
                EMBED_TITLE="💬 Issue #${NUMBER} 댓글"
              fi

              build_description "$TITLE" "$COMMENT_BODY"

              COLOR="616922"
              ;;


            pull_request_target)
              NUMBER="$(jq -r '.pull_request.number' "$GITHUB_EVENT_PATH")"
              TITLE="$(jq -r '.pull_request.title' "$GITHUB_EVENT_PATH")"
              BODY="$(jq -r '.pull_request.body // ""' "$GITHUB_EVENT_PATH")"
              URL="$(jq -r '.pull_request.html_url' "$GITHUB_EVENT_PATH")"

              # PR 작성자
              USER="$(jq -r '.pull_request.user.login' "$GITHUB_EVENT_PATH")"
              USER_URL="$(jq -r '.pull_request.user.html_url' "$GITHUB_EVENT_PATH")"
              AVATAR="$(jq -r '.pull_request.user.avatar_url' "$GITHUB_EVENT_PATH")"

              HEAD="$(jq -r '.pull_request.head.ref' "$GITHUB_EVENT_PATH")"
              BASE="$(jq -r '.pull_request.base.ref' "$GITHUB_EVENT_PATH")"
              MERGED="$(jq -r '.pull_request.merged' "$GITHUB_EVENT_PATH")"

              LABELS="$(
                jq -r \
                  '[.pull_request.labels[]?.name | "`" + . + "`"] | join(" ")' \
                  "$GITHUB_EVENT_PATH"
              )"

              BRANCH_INFO="\`${HEAD}\` → \`${BASE}\`"

              build_description "$TITLE" "$BODY"

              case "$ACTION" in
                opened)
                  EMBED_TITLE="🏃 PR #${NUMBER} 생성"
                  COLOR="13706287"
                  ;;

                reopened)
                  EMBED_TITLE="🏃 PR #${NUMBER} 재오픈"
                  COLOR="13706287"
                  ;;

                ready_for_review)
                  EMBED_TITLE="👀 PR #${NUMBER} 리뷰 준비 완료"
                  COLOR="12551936"
                  ;;

                closed)
                  if [ "$MERGED" = "true" ]; then
                    EMBED_TITLE="☑️ PR #${NUMBER} Merge"
                    COLOR="8540383"
                  else
                    EMBED_TITLE="⛔ PR #${NUMBER} 종료"
                    COLOR="13574702"
                  fi
                  ;;
              esac
              ;;


            push)
              DELETED="$(jq -r '.deleted // false' "$GITHUB_EVENT_PATH")"

              if [ "$DELETED" = "true" ]; then
                exit 0
              fi

              REF="$(jq -r '.ref' "$GITHUB_EVENT_PATH")"
              BRANCH="${REF#refs/heads/}"

              USER="$(jq -r '.sender.login' "$GITHUB_EVENT_PATH")"
              USER_URL="$(jq -r '.sender.html_url' "$GITHUB_EVENT_PATH")"
              AVATAR="$(jq -r '.sender.avatar_url' "$GITHUB_EVENT_PATH")"

              URL="$(jq -r '.compare // .repository.html_url' "$GITHUB_EVENT_PATH")"

              COUNT="$(jq -r '.commits | length' "$GITHUB_EVENT_PATH")"

              # Push에 포함된 모든 커밋의 제목 + Body 전체
              COMMIT_LIST="$(
                jq -r '
                  [
                    .commits[] |
                    "`" + (.id[0:7]) + "` " +
                    (.message // "커밋 메시지 없음")
                  ]
                  | join("\n\n")
                ' "$GITHUB_EVENT_PATH"
              )"

              COMMIT_LIST="$(truncate_text "$COMMIT_LIST" 3300)"

              EMBED_TITLE="📦 ${BRANCH} Push"

              DESCRIPTION="$(printf '**%s개 커밋**\n\n%s' "$COUNT" "$COMMIT_LIST")"

              COLOR="10906156"
              ;;
          esac


          if [ -z "$EMBED_TITLE" ]; then
            exit 0
          fi


          FIELDS='[]'


          if [ -n "$BRANCH_INFO" ]; then
            FIELDS="$(
              echo "$FIELDS" |
              jq \
                --arg value "$BRANCH_INFO" \
                '. + [{
                  name: "Branch",
                  value: $value,
                  inline: false
                }]'
            )"
          fi


          if [ -n "$LABELS" ]; then
            LABELS="$(truncate_text "$LABELS" 900)"

            FIELDS="$(
              echo "$FIELDS" |
              jq \
                --arg value "$LABELS" \
                '. + [{
                  name: "Labels",
                  value: $value,
                  inline: false
                }]'
            )"
          fi


          PAYLOAD="$(
            jq -n \
              --arg username "Today IT" \
              --arg webhook_avatar "$REPOSITORY_AVATAR" \
              --arg title "$EMBED_TITLE" \
              --arg description "$DESCRIPTION" \
              --arg url "$URL" \
              --arg user "$USER" \
              --arg user_url "$USER_URL" \
              --arg avatar "$AVATAR" \
              --arg repository "$REPOSITORY" \
              --argjson color "$COLOR" \
              --argjson fields "$FIELDS" \
              '{
                username: $username,
                avatar_url: $webhook_avatar,

                allowed_mentions: {
                  parse: []
                },

                embeds: [
                  {
                    title: $title,
                    description: $description,
                    url: $url,
                    color: $color,

                    author: {
                      name: $user,
                      url: $user_url,
                      icon_url: $avatar
                    },

                    fields: $fields,

                    footer: {
                      text: $repository
                    }
                  }
                ]
              }'
          )"


          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --request POST \
            --header "Content-Type: application/json" \
            --data "$PAYLOAD" \
            "$DISCORD_WEBHOOK_URL"
