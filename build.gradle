plugins {
    id 'base'
    id 'org.springframework.boot' version '4.1.1' apply false
    id 'io.spring.dependency-management' version '1.1.7' apply false
    id 'com.diffplug.spotless' version '8.10.0' apply false
}

allprojects {
    group = 'com.todayit'
    version = '0.0.1-SNAPSHOT'

    repositories {
        mavenCentral()
    }
}

def moduleProjects = [
    project(':apps:api'),
    project(':apps:data-worker'),
    project(':domains:recommendation'),
    project(':integrations:external-data')
]

configure(moduleProjects) {
    apply plugin: 'java'
    apply plugin: 'checkstyle'
    apply plugin: 'io.spring.dependency-management'
    apply plugin: 'com.diffplug.spotless'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    dependencyManagement {
        imports {
            mavenBom 'org.springframework.boot:spring-boot-dependencies:4.1.1'
        }
    }

    dependencies {
        testImplementation 'org.junit.jupiter:junit-jupiter'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    tasks.named('test') {
        useJUnitPlatform()
    }

    spotless {
        java {
            target 'src/**/*.java'
            googleJavaFormat()
            removeUnusedImports()
            trimTrailingWhitespace()
            endWithNewline()
        }
    }

    checkstyle {
        toolVersion = '14.0.0'
        maxWarnings = 0
        configDirectory = rootProject.layout.projectDirectory.dir('config/checkstyle')
    }

    tasks.withType(Checkstyle).configureEach {
        javaLauncher = javaToolchains.launcherFor {
            languageVersion = JavaLanguageVersion.of(21)
        }
        reports {
            xml.required = true
            html.required = true
        }
    }

    tasks.named('check') {
        dependsOn tasks.named('spotlessCheck')
    }
}

tasks.named('check') {
    dependsOn moduleProjects.collect { it.tasks.named('check') }
}
