spring:
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

todayit:
  security:
    jwt:
      secret: ${JWT_SECRET}
      access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION}
  place:
    share:
      base-url: ${PLACE_SHARE_BASE_URL}
      expiration: ${PLACE_SHARE_EXPIRATION}

springdoc:
  api-docs:
    enabled: ${OPENAPI_ENABLED:false}
scalar:
  enabled: ${OPENAPI_ENABLED:false}
