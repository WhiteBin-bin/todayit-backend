spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 32MB

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  flyway:
    enabled: true
    default-schema: ${DB_SCHEMA:todayit}
    schemas: ${DB_SCHEMA:todayit}
    create-schemas: true
    locations:
      - classpath:db/migration

todayit:
  file:
    inquiry-max-files: 5
    inquiry-max-total-size: 30MB
    provider: ${FILE_STORAGE_PROVIDER:}
    cloudinary:
      cloud-name: ${CLOUDINARY_CLOUD_NAME:}
      api-key: ${CLOUDINARY_API_KEY:}
      api-secret: ${CLOUDINARY_API_SECRET:}
      timeout: 30s

  security:
    jwt:
      secret: ${JWT_SECRET}
      access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION}

springdoc:
  api-docs:
    enabled: ${OPENAPI_ENABLED:false}
scalar:
  enabled: ${OPENAPI_ENABLED:false}
